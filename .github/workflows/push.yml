on: push
name: Push

env:
  NX_BRANCH: ${{ github.ref_name }}
  NX_CLOUD_ACCESS_TOKEN: ${{ secrets.NX_CLOUD_ACCESS_TOKEN }}
  NX_RUN_GROUP: ${{ github.run_id }}-${{ github.run_attempt }}
  SAM_CLI_TELEMETRY: 0

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: './.github/actions/setup'

  diff:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: './.github/actions/setup'
      - run: ./scripts/diff-lint

  fixup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ianwremmel/prevent-fixup-commits@v1.0.8

  lint:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: './.github/actions/setup'
      - run: npx nx format:check
      - run: npm run lint
        env:
          ESLINT_FORMAT_OPTIONS: |
            --format json-with-metadata --output-file reports/style/eslint.json
          TSC_OPTIONS: '| tee reports/style/tsc.log'
      - uses: check-run-reporter/action@v2.13.1
        if: ${{ always() }}
        with:
          token: ${{ secrets.CHECK_RUN_REPORTER_TOKEN }}
          label: ESLint
          report: 'reports/style/eslint.json'
      - uses: check-run-reporter/action@v2.13.1
        if: ${{ always() }}
        with:
          token: ${{ secrets.CHECK_RUN_REPORTER_TOKEN }}
          label: TSC
          report: 'reports/style/tsc.log'

  nopush:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ianwremmel/prevent-nopush-commits@v1.0.8

  release:
    if: ${{ github.event.repository.default_branch == github.ref_name }}
    needs:
      - build
      - diff
      - fixup
      - lint
      - nopush
      - test-integration
      - test-unit
    # contents: write lets semantic-release push tags. id-token: write lets
    # @semantic-release/npm and the npm CLI mint OIDC tokens for npm trusted
    # publishing, so the job needs no NPM_TOKEN secret.
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    # This job gets exponentially slower based on the number of packages that
    # need to be release, so 60 is not unreasonable.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: './.github/actions/setup'
      - run: |
          npx multi-semantic-release \
            --deps.release=inherit \
            --ignore-private-packages
        env:
          # multi-semantic-release rewrites each package's "*" dependency
          # ranges to the versions this run is about to publish, so reifying
          # the workspace mid-run resolves versions the registry does not have
          # yet. This has to travel as an env var: @semantic-release/npm runs
          # `npm version` with --userconfig pointed at a temp file, which
          # displaces ~/.npmrc, and env beats every config file.
          npm_config_workspaces_update: 'false'
          GIT_AUTHOR_EMAIL:
            ${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com
          GIT_COMMITTER_EMAIL:
            ${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com
          GIT_AUTHOR_NAME: ${{ github.actor }}
          GIT_COMMITTER_NAME: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-integration:
    needs: build
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        nodeCount: [5]
        nodeIndex: [0, 1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Configure AWS credentials from Test account
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}
      - uses: './.github/actions/setup'
      - name: Split example tests across the matrix
        id: split
        env:
          NODE_COUNT: ${{ matrix.nodeCount }}
          NODE_INDEX: ${{ matrix.nodeIndex }}
        run: |
          tests="$(./scripts/split-tests "$NODE_COUNT" "$NODE_INDEX" 'examples/**/*.test.ts')"
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
      # Deploy all the stacks. Assuming we tuned the matrix correctly, this
      # _should_ be one stack per job, but we treat it as a list just in case.
      - run: |
          PATH=$PATH:$(pwd)/node_modules/.bin ./scripts/crr-sam deploy ${{ steps.split.outputs.tests }}
        id: deploy
      - run: npm test -- ${{ steps.split.outputs.tests }}
        env:
          # We set RETAIN=true so that the cleanup script can take remove the
          # stack rather than doing it inside the jest lifecycle.
          RETAIN: true
          TEST_ENV: aws
      # The deploy step reports the tests whose stacks it tried to create, so we
      # tear those down and nothing else. It reports them before deploying, so a
      # deploy that dies part way through still gets cleaned up.
      - run: ./scripts/crr-sam destroy ${{ steps.deploy.outputs.deployed }}
        if: ${{ always() && steps.deploy.outputs.deployed != '' }}
      - uses: check-run-reporter/action@v2.13.1
        if: ${{ always() }}
        with:
          token: ${{ secrets.CHECK_RUN_REPORTER_TOKEN }}
          label: Examples
          nodeCount: ${{ matrix.nodeCount }}
          nodeIndex: ${{ matrix.nodeIndex }}
          report: 'reports/junit/**/*.xml'
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: 'reports/coverage'

  test-unit:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: './.github/actions/setup'
      - run: npm test -- --selectProjects 'Unit Tests'
      - uses: check-run-reporter/action@v2.13.1
        if: ${{ always() }}
        with:
          token: ${{ secrets.CHECK_RUN_REPORTER_TOKEN }}
          label: Unit Tests
          report: 'reports/junit/**/*.xml'
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: 'reports/coverage'
